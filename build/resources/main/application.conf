micronaut {
  application {
    name = strooer-challenge
  }
  server {
    port = 5001
  }
  data {
    pageable {
      default-page-size = 50
      max-page-size = 100
    }
  }
}

datasources {
  default {
    dialect=H2
    driver-class-name="org.h2.Driver"
    password=""
    url="jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE"
    username=sa
  }
}

jpa {
  default {
    properties {
      hibernate {
        hbm2ddl {
          auto=update
        }
      }
    }
  }
}

jackson {
    serializationInclusion = "ALWAYS"
}
